services:
  - type: web
    name: trolleywise-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STORE_CODE
        value: TW-STORE-001
      - key: STORE_NAME
        value: TrolleyWise Hypermarket
      - key: STORE_GSTIN
        value: 29AAAAA0000A1Z5
